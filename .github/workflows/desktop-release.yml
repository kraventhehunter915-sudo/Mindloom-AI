name: Mindloom desktop release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare NativeWind web cache
        shell: bash
        run: |
          node -e "const fs=require('fs'); const p='node_modules/react-native-css-interop/.cache/web.css'; fs.mkdirSync(require('path').dirname(p), { recursive: true }); fs.closeSync(fs.openSync(p, 'a'));"
      - run: pnpm exec expo export --platform web
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.MINDLOOM_API_BASE_URL }}
      - name: Stage renderer bundle
        shell: bash
        run: |
          rm -rf desktop/renderer
          cp -R dist desktop/renderer
      - name: Install desktop dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: desktop
      - name: Package desktop app
        run: pnpm run package
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: mindloom-${{ matrix.artifact }}
          path: desktop/dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**
